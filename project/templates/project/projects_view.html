{% extends "base.html" %}

{% block title %}Home - My Portfolio{% endblock %}

{% block content %}
    <div class="terminal">
        <div class="terminal-header">
            <span class="terminal-title">My Projects</span>
        </div>
        <div class="terminal-body">
            {% for project in projects %}
                <div class="project">
                    <h2>{{ project.title }}</h2>
                    <p>{{ project.description }}</p>
                </div>
            {% empty %}
                <p>No projects available.</p>
            {% endfor %}
        </div>
    </div>
{% endblock %}
